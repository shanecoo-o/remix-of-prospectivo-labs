<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset=".55" stop-color="#172554"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="brand" x1="120" y1="110" x2="980" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563eb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.145 0 0 0 0 0.388 0 0 0 0 0.922 0 0 0 .7 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="945" cy="95" r="230" fill="#2563eb" opacity=".16"/>
  <circle cx="150" cy="520" r="250" fill="#38bdf8" opacity=".13"/>

  <g filter="url(#glow)">
    <circle cx="925" cy="330" r="118" fill="url(#brand)" opacity=".95"/>
    <circle cx="925" cy="330" r="170" fill="none" stroke="#93c5fd" stroke-opacity=".28" stroke-width="2"/>
    <circle cx="925" cy="330" r="220" fill="none" stroke="#93c5fd" stroke-opacity=".15" stroke-width="2"/>
    <circle cx="795" cy="210" r="12" fill="#bfdbfe"/>
    <circle cx="1052" cy="212" r="12" fill="#bfdbfe"/>
    <circle cx="1094" cy="390" r="12" fill="#bfdbfe"/>
    <circle cx="765" cy="420" r="12" fill="#bfdbfe"/>
    <path d="M795 210L925 330L1052 212M925 330L1094 390M925 330L765 420" stroke="#bfdbfe" stroke-width="3" stroke-opacity=".55"/>
  </g>

  <text x="90" y="126" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="5">
    CENTRO PROSPECTIVO TECNOLÓGICO
  </text>

  <text x="90" y="255" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="900">
    Tecnologia, marca
  </text>
  <text x="90" y="335" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="900">
    e crescimento.
  </text>

  <text x="90" y="410" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="500">
    Websites • Sistemas • Apps • Marketing • Motion • Automação
  </text>

  <rect x="90" y="465" width="365" height="58" rx="29" fill="url(#brand)"/>
  <text x="122" y="502" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">
    Diagnóstico Gratuito
  </text>
</svg>